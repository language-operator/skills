name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shellcheck skill scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          scripts=(plugins/**/scripts/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No skill scripts yet, nothing to check"
            exit 0
          fi
          shellcheck "${scripts[@]}"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Manifests parse as JSON
        shell: bash
        run: |
          shopt -s nullglob
          for manifest in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            echo "Checking $manifest"
            jq empty "$manifest"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # No credentials needed: validate only reads the manifests and skills.
      - name: Validate marketplace and plugins
        shell: bash
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done
